name: grasp
description: "Lern-App für zusammenhängendes Verständnis – erklären statt pauken."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  record: ^7.1.1
  deepgram_speech_to_text: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: DMSans
      fonts:
        - asset: "assets/fonts/DMSans-VariableFont_opsz,wght.ttf"
